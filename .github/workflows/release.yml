# Builds the Windows installer and the macOS disk image, then publishes a GitHub release.
# Runs when a version tag (v1.2.3) is pushed, or manually from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create / publish (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Lint (effects, presets, shaders)
        run: cargo run --release -- --lint
      - name: Build
        run: cargo build --release
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$version" packaging\windows\effector.iss
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Lint (effects, presets, shaders)
        run: cargo run --release -- --lint
      - name: Build app + disk image
        run: bash packaging/macos/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes (docs/releases/<tag>.md)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ -f "docs/releases/$TAG.md" ]; then
            cp "docs/releases/$TAG.md" notes.md
          else
            echo "::warning::docs/releases/$TAG.md not found, using the default text"
            printf '%s\n' "EFFECTOR $TAG para macOS e Windows." > notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: EFFECTOR ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          files: dist/*
          body_path: notes.md
