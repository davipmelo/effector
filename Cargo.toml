[package]
name = "effector"
version = "0.8.2"
edition = "2024"
default-run = "effector"
description = "Layer-based image effects for macOS and Windows"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.7.0"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.37.0"
egui-wgpu = "0.37.0"
half = { version = "2.7.1", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }
jpeg-encoder = "0.7.1"
naga = { version = "30.0.2", features = ["glsl-in", "wgsl-out"] }
open = "5.4.5"
pollster = "1.0.3"
qcms = "0.3.0"
rawler = "0.8.0"
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sys-locale = "0.3.2"
tiny-skia = "0.12.0"
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
wgpu = { version = "30.0.2", features = ["glsl", "naga-ir"] }
zip = "9.8.2"
tract-onnx = "0.23.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"
